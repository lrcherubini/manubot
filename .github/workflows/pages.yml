name: "Pages: build e deploy"
# Na lista do Actions: PR aparece como "Validação" (sem publicar), main como "Deploy"
run-name: "${{ github.event_name == 'pull_request' && format('Validação · PR #{0} · {1}', github.event.pull_request.number, github.event.pull_request.title) || (github.event_name == 'workflow_dispatch' && 'Deploy manual' || format('Deploy · {0}', github.event.head_commit.message)) }}"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Monta e valida o site em todo PR; publica só a partir do main
  build:
    name: Validar site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Montar site
        run: |
          mkdir _site
          cp index.html sw.js manifest.webmanifest .nojekyll *.png *.svg _site/
          cp -r fonts _site/
      - name: Validar arquivos do cache offline
        run: |
          missing=0
          for f in $(grep -oE "^  '[^']+'," sw.js | tr -d "', "); do
            [ "$f" = "./" ] && continue
            [ -f "_site/$f" ] || { echo "::error::sw.js referencia arquivo inexistente: $f"; missing=1; }
          done
          exit $missing
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publicar no Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
